- Description: "A Firefox b\xF6ng\xE9sz\u0151, m\xE1s n\xE9ven Mozilla Firefox vagy
    egyszer\u0171en Firefox, egy ingyenes \xE9s ny\xEDlt forr\xE1sk\xF3d\xFA webb\xF6ng\xE9sz\u0151
    amelyet a Mozilla Foundation \xE9s le\xE1nyv\xE1llalata, a Mozilla Corporation
    fejlesztett ki. A Firefox a Gecko elrendez\xE9si motor haszn\xE1lja a weboldalak
    megjelen\xEDt\xE9s\xE9hez, a jelenlegi \xE9s a v\xE1rhat\xF3 webes szabv\xE1nyok
    szerint. 2017-ben a Firefox Quantum k\xF3dn\xE9ven \xFAj technol\xF3gi\xE1t kezdett
    be\xE9p\xEDteni a p\xE1rhuzamos v\xE9grehajt\xE1st \xE9s a intuit\xEDvabb felhaszn\xE1l\xF3i
    fel\xFCletet c\xE9lozva meg. A Firefox hivatalosan el\xE9rhet\u0151 Windows 7
    vagy \xFAjabb, macOS \xE9s Linux rendszerekhez. Nem hivatalos portjai k\xFCl\xF6nf\xE9le
    Unix \xE9s Unix-szer\u0171 oper\xE1ci\xF3s rendszerekhez \xE9rhet\u0151k el, bele\xE9rtve
    a FreeBSD-t, OpenBSD, NetBSD, illumos \xE9s Solaris Unix."
