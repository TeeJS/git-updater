- Description: "Mozilla Firefox, kurz Firefox genannt, ist ein freier Webbrowser des
    Mozilla-Projektes. Er wurde im September 2002 ver\xF6ffentlicht. Firefox verwendet
    die Gecko-Layout-Engine zum Rendern von Webseiten, die aktuelle und erwartete
    Webstandards implementiert. Im Jahr 2017 begann Firefox mit der Einf\xFChrung
    neuer Technologien unter dem Codenamen Quantum, um Parallelit\xE4t und eine intuitivere
    Benutzeroberfl\xE4che zu f\xF6rdern. Seine inoffiziellen Ports sind f\xFCr verschiedene
    Unix- und Unix-\xE4hnliche Betriebssysteme verf\xFCgbar, darunter FreeBSD, OpenBSD,
    NetBSD, illumos und Solaris Unix."
