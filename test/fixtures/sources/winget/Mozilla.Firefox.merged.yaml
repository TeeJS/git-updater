- Description: "\u0411\u0440\u0430\u0443\u0437\u0435\u0440 Firefox, \u0442\u0430\u043A\u0436\u0435
    \u0438\u0437\u0432\u0435\u0441\u0442\u043D\u044B\u0439 \u043A\u0430\u043A Mozilla
    Firefox \u0438\u043B\u0438 \u043F\u0440\u043E\u0441\u0442\u043E Firefox, - \u044D\u0442\u043E
    \u0431\u0435\u0441\u043F\u043B\u0430\u0442\u043D\u044B\u0439 \u0432\u0435\u0431-\u0431\u0440\u0430\u0443\u0437\u0435\u0440
    \u0441 \u043E\u0442\u043A\u0440\u044B\u0442\u044B\u043C \u0438\u0441\u0445\u043E\u0434\u043D\u044B\u043C
    \u043A\u043E\u0434\u043E\u043C, \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u0430\u043D\u043D\u044B\u0439
    Mozilla Foundation \u0438 \u0435\u0433\u043E \u0434\u043E\u0447\u0435\u0440\u043D\u0435\u0439
    \u043A\u043E\u043C\u043F\u0430\u043D\u0438\u0435\u0439 Mozilla Corporation. Firefox
    \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442 \u043C\u0435\u0445\u0430\u043D\u0438\u0437\u043C
    \u043A\u043E\u043C\u043F\u043E\u043D\u043E\u0432\u043A\u0438 Gecko \u0434\u043B\u044F
    \u043E\u0442\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u044F \u0432\u0435\u0431-\u0441\u0442\u0440\u0430\u043D\u0438\u0446,
    \u043A\u043E\u0442\u043E\u0440\u044B\u0439 \u0440\u0435\u0430\u043B\u0438\u0437\u0443\u0435\u0442
    \u0442\u0435\u043A\u0443\u0449\u0438\u0435 \u0438 \u043E\u0436\u0438\u0434\u0430\u0435\u043C\u044B\u0435
    \u0432\u0435\u0431-\u0441\u0442\u0430\u043D\u0434\u0430\u0440\u0442\u044B. \u0412
    2017 \u0433\u043E\u0434\u0443 Firefox \u043D\u0430\u0447\u0430\u043B \u0432\u043A\u043B\u044E\u0447\u0430\u0442\u044C
    \u043D\u043E\u0432\u0443\u044E \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u044E
    \u043F\u043E\u0434 \u043A\u043E\u0434\u043E\u0432\u044B\u043C \u043D\u0430\u0437\u0432\u0430\u043D\u0438\u0435\u043C
    Quantum, \u0447\u0442\u043E\u0431\u044B \u0441\u043F\u043E\u0441\u043E\u0431\u0441\u0442\u0432\u043E\u0432\u0430\u0442\u044C
    \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u0438\u0437\u043C\u0443 \u0438
    \u0431\u043E\u043B\u0435\u0435 \u0438\u043D\u0442\u0443\u0438\u0442\u0438\u0432\u043D\u043E\u043C\u0443
    \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u044C\u0441\u043A\u043E\u043C\u0443
    \u0438\u043D\u0442\u0435\u0440\u0444\u0435\u0439\u0441\u0443. Firefox \u043E\u0444\u0438\u0446\u0438\u0430\u043B\u044C\u043D\u043E
    \u0434\u043E\u0441\u0442\u0443\u043F\u0435\u043D \u0434\u043B\u044F Windows 7
    \u0438\u043B\u0438 \u043D\u043E\u0432\u0435\u0435, macOS \u0438 Linux. \u0415\u0433\u043E
    \u043D\u0435\u043E\u0444\u0438\u0446\u0438\u0430\u043B\u044C\u043D\u044B\u0435
    \u043F\u043E\u0440\u0442\u044B \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u044B
    \u0434\u043B\u044F \u0440\u0430\u0437\u043B\u0438\u0447\u043D\u044B\u0445 Unix
    \u0438 Unix-\u043F\u043E\u0434\u043E\u0431\u043D\u044B\u0445 \u043E\u043F\u0435\u0440\u0430\u0446\u0438\u043E\u043D\u043D\u044B\u0445
    \u0441\u0438\u0441\u0442\u0435\u043C, \u0432\u043A\u043B\u044E\u0447\u0430\u044F
    FreeBSD, OpenBSD, NetBSD, illumos \u0438 Solaris Unix."
