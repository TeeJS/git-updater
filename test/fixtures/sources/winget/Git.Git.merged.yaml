ReleaseNotes: 'Changes since Git for Windows v2.56.0(3) (October 22nd 2026)

  This is another urgent security bug fix release, addressing CVE-2026-111497.

  Bug Fixes

  - The executables included in the 32-bit MinGit had corrupt code-signatures, which
  has been fixed.

  - Upgrades the included brotli component to v1.2.1 to address CVE-2026-111497.'
