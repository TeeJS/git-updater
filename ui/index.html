<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git-updater</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font: 15px/1.5 system-ui, Segoe UI, sans-serif; margin: 0; padding: 1.5rem;
         max-width: 1000px; margin-inline: auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  h2 { font-size: 1.1rem; margin: .2rem 0 .75rem; }
  .sub { opacity: .7; margin: 0 0 1.25rem; }
  .card { border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
          border-radius: 8px; padding: 1rem; margin-bottom: 1.25rem; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  label { font-weight: 600; }
  input, select, button { font: inherit; padding: .4rem .5rem; border-radius: 6px;
          border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
          background: transparent; color: inherit; }
  /* native select + its option list: theme-aware so it's readable in light and dark */
  select { background: Field; color: FieldText; }
  select option { background: Field; color: FieldText; }
  button { cursor: pointer; font-weight: 600; }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  button.danger { border-color: #dc2626; color: #dc2626; }
  table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom:
           1px solid color-mix(in srgb, currentColor 12%, transparent); vertical-align: middle; }
  th { font-size: .8rem; text-transform: uppercase; opacity: .6; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
  pre { white-space: pre-wrap; margin: .5rem 0 0; }
  .ok { color: #16a34a; } .bad { color: #dc2626; } .muted { opacity: .6; }
  .pill { font-size: .8rem; padding: .1rem .45rem; border-radius: 999px;
          border: 1px solid color-mix(in srgb, currentColor 30%, transparent); }
  #msg { min-height: 1.2rem; margin: .5rem 0; }
</style>
</head>
<body>
<h1>git-updater</h1>
<p class="sub">On-demand updater for GitHub-release apps — portable &amp; installed.</p>
<div id="msg"></div>

<div class="card">
  <div class="row">
    <label for="portableRoot">Portable apps folder</label>
    <input type="text" id="portableRoot" placeholder="C:/PortableApps" style="flex:1;min-width:16rem">
    <button id="saveRoot">Save</button>
  </div>
  <p class="muted" style="margin:.5rem 0 0">Portable apps unzip to <code>&lt;this folder&gt;/&lt;repo&gt;</code>.</p>
</div>

<div class="card">
  <h2>Tracked apps</h2>
  <table id="repos"><thead><tr>
    <th>Repo</th><th>Type</th><th>Installs to</th><th></th>
  </tr></thead><tbody></tbody></table>

  <div class="row" style="margin-top:1rem">
    <input type="text" id="newRepo" placeholder="https://github.com/owner/repo/releases  (or owner/repo)" style="flex:1;min-width:20rem">
    <select id="newType">
      <option value="portable">Portable</option>
      <option value="installer">Installed</option>
    </select>
    <button id="addRepo" class="primary">Add</button>
  </div>
  <p class="muted" style="margin:.5rem 0 0">Paste the repo's releases link and pick Portable or Installed — it grabs the right Windows file automatically.</p>
</div>

<div class="card">
  <div class="row">
    <button id="checkBtn">Check for updates</button>
    <button id="updateBtn" class="primary">Update all</button>
    <label class="row" style="gap:.3rem"><input type="checkbox" id="dryRun"> dry run</label>
    <label class="row" style="gap:.3rem"><input type="checkbox" id="force"> force</label>
    <span id="busy" class="muted"></span>
  </div>
  <pre id="results"></pre>
</div>

<script>
let config = { portableRoot: '', repos: [] };

const $ = (id) => document.getElementById(id);
const msg = (t, bad) => { const m = $('msg'); m.textContent = t || ''; m.className = bad ? 'bad' : 'ok'; };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// "https://github.com/ShareX/ShareX/releases" or "ShareX/ShareX" -> {owner, repo}
function parseRepo(s) {
  s = s.trim();
  let m = s.match(/github\.com\/([^/\s]+)\/([^/\s#?]+)/i);
  if (m) return { owner: m[1], repo: m[2].replace(/\.git$/i, '') };
  m = s.match(/^([^/\s]+)\/([^/\s]+)$/);
  if (m) return { owner: m[1], repo: m[2] };
  return null;
}

function installTarget(repo) {
  if (repo.type === 'installer') return 'runs installer';
  if (repo.install && repo.install.dir) return repo.install.dir;
  return config.portableRoot ? `${config.portableRoot.replace(/[\\/]+$/, '')}/${repo.repo}` : '(set portable folder)';
}

function renderRepos() {
  const tb = $('repos').querySelector('tbody');
  tb.innerHTML = '';
  config.repos.forEach((r, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><code>${r.owner}/${r.repo}</code></td>
      <td><span class="pill">${r.type === 'installer' ? 'installed' : 'portable'}</span></td>
      <td class="muted">${installTarget(r)}</td>
      <td><button class="danger" data-i="${i}">Remove</button></td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll('button[data-i]').forEach((b) =>
    b.onclick = () => { config.repos.splice(+b.dataset.i, 1); renderRepos(); saveConfig(); });
}

async function saveConfig() {
  config.portableRoot = $('portableRoot').value.trim(); // folder field is the source of truth
  try {
    await api('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(config) });
    msg('Saved.');
  } catch (e) {
    msg(e.message, true);
  }
  await load(); // reflect what actually persisted — never show a row that didn't save
}

async function load() {
  config = await api('/api/config');
  if (!config.repos) config.repos = [];
  $('portableRoot').value = config.portableRoot || '';
  renderRepos();
}

$('saveRoot').onclick = () => { config.portableRoot = $('portableRoot').value.trim(); saveConfig(); };

$('addRepo').onclick = () => {
  const parsed = parseRepo($('newRepo').value);
  if (!parsed) return msg('Paste a github releases URL or owner/repo', true);
  if (config.repos.some((r) => r.owner === parsed.owner && r.repo === parsed.repo && r.type === $('newType').value))
    return msg(`${parsed.owner}/${parsed.repo} (${$('newType').value}) is already tracked`, true);
  config.repos.push({ owner: parsed.owner, repo: parsed.repo, type: $('newType').value });
  $('newRepo').value = '';
  renderRepos(); saveConfig();
};
$('newRepo').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('addRepo').click(); });

async function run(path, body) {
  $('busy').textContent = 'Working…';
  $('results').textContent = '';
  try {
    const { summary } = await api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    $('results').textContent = summary.text;
    msg('Done.');
  } catch (e) { msg(e.message, true); }
  finally { $('busy').textContent = ''; }
}

$('checkBtn').onclick = () => run('/api/check');
$('updateBtn').onclick = () => run('/api/update', { dryRun: $('dryRun').checked, force: $('force').checked });

load().catch((e) => msg(e.message, true));
</script>
</body>
</html>
