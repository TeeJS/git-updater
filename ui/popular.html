<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'self'">
<title>Popular apps and packs — git-updater</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --faint: #6e7681;
    --accent: #e3a13c; --accent-ink: #1a1206; --green: #3fb950; --blue: #58a6ff; --red: #f85149;
    --mono: 'Cascadia Code', 'Cascadia Mono', Consolas, ui-monospace, monospace;
    --sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1rem 1.2rem; color: var(--text); font: 14.5px/1.45 var(--sans); background: var(--bg);
         display: flex; flex-direction: column; height: 100vh; }
  .top { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
  h1 { font: 600 1rem var(--mono); margin: 0; }
  .seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 9px; background: var(--panel); border: 1px solid var(--border); }
  .seg button { border: 1px solid transparent; background: transparent; color: var(--muted); padding: .3rem .8rem; border-radius: 6px; font: 600 13px var(--sans); cursor: pointer; }
  .seg button.active { background: #21262d; color: var(--text); border-color: #444c56; }
  input[type=text] { background: #0d1117; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: .42rem .65rem; font: 13.5px var(--sans); }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; flex: none; }
  #filter { margin-left: auto; width: 13rem; }
  #status { min-height: 1.2rem; color: var(--muted); margin: .5rem 0 .2rem; font-size: 13px; }
  #status.bad { color: var(--red); } #status.ok { color: var(--green); }
  .body { flex: 1; overflow-y: auto; border-top: 1px solid var(--border); padding-top: .7rem; }
  /* Categories flow into as many columns as fit; a category never splits across two. */
  .cats { columns: 15.5rem; column-gap: 1.6rem; }
  .cat { break-inside: avoid; margin: 0 0 1.1rem; }
  /* ...except a very long one, which would otherwise strand every column after it. */
  .cat.long { break-inside: auto; }
  .cat.long h2 { break-after: avoid; }
  .cat h2 { font: 600 13px var(--sans); color: var(--text); margin: 0 0 .35rem; padding-bottom: .25rem; border-bottom: 1px solid var(--border); }
  .item { display: flex; align-items: center; gap: .45rem; padding: .16rem 0; cursor: pointer; min-width: 0; }
  .item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .src { margin-left: auto; padding-left: .4rem; font-size: 11px; color: var(--faint); white-space: nowrap; }
  .item.tracked { color: var(--faint); cursor: default; }
  .item.tracked .src { color: var(--green); }
  .badge { display: inline-block; font: 600 10.5px var(--sans); line-height: 15px; padding: 0 .42rem; border-radius: 999px; color: var(--muted); border: 1px solid var(--border); background: #0d1117; white-space: nowrap; }
  .badge.blue { color: var(--blue); border-color: rgba(88,166,255,.35); }
  .badge.warn { color: var(--accent); border-color: rgba(227,161,60,.4); }
  /* Review: what would be added, per app, before anything is. */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 0 .5rem .4rem 0; }
  td { padding: .42rem .5rem .42rem 0; border-top: 1px solid var(--border); vertical-align: top; font-size: 13px; }
  td.name { font-weight: 600; }
  td .sub { display: block; font-size: 11.5px; color: var(--faint); overflow-wrap: anywhere; }
  tr.off td { color: var(--faint); }
  .mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .sum-none { color: var(--accent); }
  /* Packs */
  .packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: .7rem; }
  .pack { border: 1px solid var(--border); border-radius: 10px; padding: .7rem .8rem; background: var(--panel); display: flex; flex-direction: column; gap: .3rem; }
  .pack h3 { font: 600 14px var(--sans); margin: 0; display: flex; align-items: center; gap: .4rem; }
  .pack p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .pack .apps { font-size: 12px; color: var(--faint); }
  .pack .acts { display: flex; gap: .35rem; flex-wrap: wrap; margin-top: auto; padding-top: .4rem; }
  .sec { font: 600 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 1rem 0 .5rem; }
  .sec:first-child { margin-top: 0; }
  .sec .why { font: 400 12px var(--sans); letter-spacing: 0; text-transform: none; }
  /* The Windows-only runtimes sit under their own heading, below every ordinary category. */
  #viewApps .sec { margin-top: .3rem; padding-top: .8rem; border-top: 1px solid var(--border); }
  #viewApps .sec:first-child { padding-top: 0; border-top: 0; }
  .newpack { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; margin-bottom: .2rem; }
  .newpack input { flex: 1; min-width: 12rem; }
  button.act { font: 600 13px var(--sans); cursor: pointer; border-radius: 8px; padding: .42rem .8rem; border: 1px solid var(--border); background: #21262d; color: var(--text); }
  button.act.small { padding: .26rem .6rem; font-size: 12px; }
  button.act:hover:not(:disabled) { background: #2a313a; }
  button.act:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button.danger { color: var(--red); }
  .bar { display: flex; gap: .55rem; align-items: center; padding-top: .7rem; border-top: 1px solid var(--border); }
  .bar .count { margin-right: auto; color: var(--muted); font-size: 13px; }
  /* What the favorites file could not use: one quiet line, the reasons a click away. */
  #favNote { margin: 0 0 .5rem; font-size: 12.5px; color: var(--accent); }
  #favNote summary { cursor: pointer; }
  #favNote ul { margin: .3rem 0 0; padding-left: 1.2rem; color: var(--muted); }
  #favNote li { margin: .1rem 0; overflow-wrap: anywhere; }
  /* What an app is, shown beside its row on hover or keyboard focus. Drawn by the page, not
     the system's own tooltip: that one never appeared in this window on macOS. */
  #tip { position: fixed; z-index: 30; max-width: min(24rem, calc(100vw - 1.5rem)); padding: .4rem .6rem; border-radius: 8px;
         background: #21262d; border: 1px solid #444c56; color: var(--text); font-size: 12.5px; line-height: 1.4;
         box-shadow: 0 10px 28px -10px #000; pointer-events: none; }
  #tip .from { display: block; margin-top: .12rem; font-size: 11.5px; color: var(--muted); }
  .packform { display: inline-flex; gap: .4rem; align-items: center; }
  .packform input { width: 13rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="top">
  <h1>Add apps</h1>
  <div class="seg" id="tabs">
    <button type="button" data-tab="apps" class="active">Popular apps</button>
    <button type="button" data-tab="packs">Packs</button>
  </div>
  <input type="text" id="filter" placeholder="Filter…" aria-label="Filter apps">
  <button type="button" class="act small" id="favEdit" title="Open your favorites file: your own apps and packs, added to this window">My favorites…</button>
</div>
<div id="status">Loading…</div>
<details id="favNote" class="hidden"><summary></summary><ul></ul></details>

<div class="body">
  <div id="viewApps"></div>
  <div id="viewPacks" class="hidden"></div>
  <div id="viewReview" class="hidden"></div>
</div>

<div id="tip" class="hidden" role="tooltip"><span class="what"></span><span class="from"></span></div>

<div class="bar">
  <span class="count" id="count"></span>
  <button class="act hidden" id="savePack" title="Save the ticked apps as a pack you can add again later, or export">Save as pack…</button>
  <span class="packform hidden" id="packForm">
    <input type="text" id="packName" placeholder="Name for the pack" maxlength="80" aria-label="Name for the pack">
    <button class="act" id="packSave">Save</button>
    <button class="act" id="packCancel">Cancel</button>
  </span>
  <button class="act hidden" id="back">Back</button>
  <button class="act" id="close">Close</button>
  <button class="act primary" id="go" disabled>Review and add</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const clean = (e) => String(e && e.message ? e.message : e).replace(/^Error:\s*/, '').replace(/^Error invoking remote method '[^']+':\s*(Error:\s*)?/, '');
const status = (t, cls) => { $('status').textContent = t || ''; $('status').className = cls || ''; };
const SUM = { pinned: 'checksum pinned by the listing', published: 'checksum published', none: 'no checksum published' };

let tab = 'apps';
let apps = [];             // [{ id, name, category, sources[], tracked }]
const picked = new Set();  // shortcut ids ticked in the Popular apps list
let plan = null;           // rows under review
let planFrom = 'apps';     // which view Back returns to
const chosen = new Set();  // indexes of plan rows that will be added

// --- Popular apps -----------------------------------------------------------------
const WINDOWS_ONLY = 'Windows only';
function renderApps() {
  hideTip(); // the rows it points at are about to be replaced
  const box = $('viewApps'); box.innerHTML = '';
  const q = $('filter').value.trim().toLowerCase();
  // Two groups: the ordinary categories, then the Windows-only runtimes (.NET, VC++). Main only
  // sends those on Windows, so on macOS and Linux the second group is empty and never drawn.
  const groups = [new Map(), new Map()];
  for (const a of apps) {
    if (q && !a.name.toLowerCase().includes(q) && !a.category.toLowerCase().includes(q) && !(a.windowsOnly && WINDOWS_ONLY.toLowerCase().includes(q))) continue;
    const cats = groups[a.windowsOnly ? 1 : 0];
    if (!cats.has(a.category)) cats.set(a.category, []);
    cats.get(a.category).push(a);
  }
  groups.forEach((cats, windowsOnly) => {
    if (!cats.size) return;
    if (windowsOnly) {
      const h = el('div', 'sec', WINDOWS_ONLY);
      h.appendChild(el('span', 'why', ' — runtimes that other Windows apps need'));
      box.appendChild(h);
    }
    const grid = el('div', 'cats');
    for (const [name, list] of cats) {
      const sec = el('section', 'cat' + (list.length > 24 ? ' long' : ''));
      sec.appendChild(el('h2', null, name));
      // Numeric, so ".NET Desktop Runtime 8" sorts before "10" and Java 8 before Java 11.
      list.sort((x, y) => x.name.localeCompare(y.name, undefined, { numeric: true, sensitivity: 'base' }));
      for (const a of list) {
        const row = el('label', 'item' + (a.tracked ? ' tracked' : ''));
        const cb = el('input'); cb.type = 'checkbox'; cb.dataset.app = a.id;
        cb.checked = a.tracked || picked.has(a.id); cb.disabled = a.tracked;
        cb.onchange = () => {
          cb.checked ? picked.add(a.id) : picked.delete(a.id);
          // An app pinned to My favorites has a second row in its own category: keep them in step.
          for (const other of box.querySelectorAll('input[type=checkbox]')) if (other !== cb && other.dataset.app === a.id) other.checked = cb.checked;
          sync();
        };
        row.appendChild(cb);
        row.appendChild(el('span', 'nm', a.name));
        // Where it can come from on this computer — shown before anything is picked.
        row.appendChild(el('span', 'src', a.tracked ? 'in your list' : a.sources.join(' · ')));
        // Shown by the tooltip (see showTip): what the app is — the built-in line, or the user's
        // own for a favorite — then where it would come from.
        row.dataset.what = a.description || '';
        row.dataset.from = a.tracked ? 'Already in your list' : `Available from ${a.sources.join(', ')}`;
        if (a.description) cb.setAttribute('aria-description', a.description);
        sec.appendChild(row);
      }
      grid.appendChild(sec);
    }
    box.appendChild(grid);
  });
  if (!groups[0].size && !groups[1].size) box.appendChild(el('p', null, 'Nothing matches that filter.'));
}

// --- Review: the same step for the picker and for a pack ----------------------------
function showView(name) {
  hideTip();
  for (const v of ['viewApps', 'viewPacks', 'viewReview']) $(v).classList.toggle('hidden', v !== name);
  $('back').classList.toggle('hidden', name !== 'viewReview');
  $('filter').classList.toggle('hidden', name !== 'viewApps');
  $('tabs').classList.toggle('hidden', name === 'viewReview');
}
function renderReview() {
  const box = $('viewReview'); box.innerHTML = '';
  const table = el('table');
  const head = el('tr');
  for (const h of ['', 'App', 'Source', 'File', 'Type', 'Version']) head.appendChild(el('th', null, h));
  table.appendChild(head);
  plan.forEach((r, i) => {
    const tr = el('tr', r.ok ? null : 'off');
    const c = el('td'); const cb = el('input'); cb.type = 'checkbox'; cb.disabled = !r.ok; cb.checked = chosen.has(i);
    cb.onchange = () => { cb.checked ? chosen.add(i) : chosen.delete(i); sync(); };
    c.appendChild(cb); tr.appendChild(c);
    tr.appendChild(el('td', 'name', r.name));
    const src = el('td');
    if (r.listedBy) src.appendChild(el('span', 'badge blue', r.listedBy));
    if (r.publisher) src.appendChild(el('span', 'sub', `publisher ${r.publisher}`));
    tr.appendChild(src);
    const file = el('td');
    if (r.ok) {
      file.appendChild(el('span', 'mono', r.file));
      // The full declared address, not just its host — the file's origin is never implied.
      if (r.url) file.appendChild(el('span', 'sub mono', r.url));
      const sub = el('span', 'sub', `from ${r.host} — `);
      sub.appendChild(el('span', r.checksum === 'none' ? 'sum-none' : null, SUM[r.checksum] || ''));
      file.appendChild(sub);
      if (r.emulated) file.appendChild(el('span', 'sub sum-none', 'not native to this computer — runs under emulation; tick to add anyway'));
      if (r.requires && r.requires.length) file.appendChild(el('span', 'sub', `needs ${r.requires.join(', ')}`));
      if (r.note) file.appendChild(el('span', 'sub', r.note));
    } else {
      file.appendChild(el('span', null, r.tracked ? 'Already in your list' : `Not available — ${r.reason}`));
    }
    tr.appendChild(file);
    const type = el('td'); if (r.ok) type.appendChild(el('span', 'badge' + (r.type === 'installer' ? ' warn' : ' blue'), r.type === 'installer' ? 'Installer' : 'Portable')); tr.appendChild(type);
    tr.appendChild(el('td', 'mono', r.version || ''));
    table.appendChild(tr);
  });
  box.appendChild(table);
}
async function review(getPlan, from, label) {
  planFrom = from; plan = []; chosen.clear();
  showView('viewReview'); $('viewReview').innerHTML = '';
  status(`Checking what this computer would get for ${label}…`);
  $('go').disabled = true;
  try {
    plan = await getPlan();
    // Ticked by default: everything installable and native. Emulated builds wait for a tick.
    plan.forEach((r, i) => { if (r.ok && !r.emulated) chosen.add(i); });
    const ok = plan.filter((r) => r.ok).length;
    status(ok ? `${ok} of ${plan.length} can be added. Each row shows where its file comes from — untick anything you do not want.` : 'None of these can be added on this computer.', ok ? '' : 'bad');
    renderReview();
  } catch (e) { status(clean(e), 'bad'); }
  sync();
}
async function addChosen() {
  const items = [...chosen].map((i) => plan[i]).filter((r) => r && r.ok).map((r) => ({ source: r.source, name: r.name, type: r.type }));
  if (!items.length) return;
  $('go').disabled = true;
  try {
    const res = await window.api.addSources(items);
    const clash = (res.conflicts || []).map((c) => `${c.name} (same folder as ${c.with})`);
    status(`Added ${res.added} app${res.added === 1 ? '' : 's'}${res.skipped ? `, ${res.skipped} already in your list` : ''}${clash.length ? `. Not added: ${clash.join(', ')}` : ''}. Use Check all in the main window to see versions.`, clash.length ? 'bad' : 'ok');
    picked.clear(); chosen.clear();
    apps = await window.api.popularList();
    plan = null; showView(planFrom === 'packs' ? 'viewPacks' : 'viewApps');
    if (planFrom === 'packs') await loadPacks(); else renderApps();
  } catch (e) { status(clean(e), 'bad'); }
  sync();
}

// --- Packs ---------------------------------------------------------------------------
async function loadPacks() {
  const box = $('viewPacks'); box.innerHTML = '';
  const { builtin, mine } = await window.api.packsList();
  const card = (p) => {
    const c = el('div', 'pack');
    const h = el('h3', null, p.name);
    if (p.builtin) h.appendChild(el('span', 'badge', 'Built-in'));
    if (p.fromFile) { const b = el('span', 'badge blue', favFile); b.title = `Written in your ${favFile} — edit it there`; h.appendChild(b); }
    c.appendChild(h);
    if (p.description) c.appendChild(el('p', null, p.description));
    c.appendChild(el('p', 'apps', `${p.available} of ${p.count} available on this computer: ${p.apps.join(', ')}`));
    const acts = el('div', 'acts');
    const go = el('button', 'act small primary', 'Review and add'); go.disabled = !p.available;
    go.onclick = () => review(() => window.api.packsPlan(p.id), 'packs', `the ${p.name} pack`);
    const ex = el('button', 'act small', 'Export…');
    ex.onclick = async () => { try { const r = await window.api.packsExport(p.id); if (r.saved) status(`Exported to ${r.path}.`, 'ok'); } catch (e) { status(clean(e), 'bad'); } };
    acts.append(go, ex);
    if (!p.builtin && !p.fromFile) {
      const del = el('button', 'act small danger', 'Delete');
      del.onclick = async () => { if (!confirm(`Delete the pack "${p.name}"? Apps already added stay in your list.`)) return; await window.api.packsDelete(p.id); loadPacks(); };
      acts.appendChild(del);
    }
    c.appendChild(acts);
    return c;
  };
  box.appendChild(el('div', 'sec', 'My packs'));
  const make = el('div', 'newpack');
  const name = el('input'); name.type = 'text'; name.placeholder = 'Name for a new pack, e.g. Work laptop'; name.maxLength = 80;
  const save = el('button', 'act', 'Save my current apps as a pack');
  save.onclick = async () => {
    if (!name.value.trim()) { status('Give the pack a name first.', 'bad'); name.focus(); return; }
    try { const p = await window.api.packsSave(name.value.trim(), 'Saved from this computer.', null); status(`Saved "${p.name}" with ${p.count} app${p.count === 1 ? '' : 's'}.`, 'ok'); loadPacks(); }
    catch (e) { status(clean(e), 'bad'); }
  };
  const imp = el('button', 'act', 'Import pack…');
  imp.onclick = async () => {
    try {
      const r = await window.api.packsImport();
      if (r.imported) { status(`Imported "${r.pack.name}"${r.dropped ? ` — ${r.dropped} entr${r.dropped === 1 ? 'y' : 'ies'} it listed were not recognised and were left out` : ''}. Nothing is added until you review it.`, 'ok'); loadPacks(); }
    } catch (e) { status(clean(e), 'bad'); }
  };
  make.append(name, save, imp); box.appendChild(make);
  const mineGrid = el('div', 'packs'); mine.forEach((p) => mineGrid.appendChild(card(p)));
  if (!mine.length) box.appendChild(el('p', 'apps', 'None yet. Save the apps on this computer as a pack, then export it to set up another one.'));
  box.appendChild(mineGrid);
  box.appendChild(el('div', 'sec', 'Built-in packs'));
  const grid = el('div', 'packs'); builtin.forEach((p) => grid.appendChild(card(p))); box.appendChild(grid);
}

// --- shell ---------------------------------------------------------------------------
function sync() {
  const reviewing = !$('viewReview').classList.contains('hidden');
  if (reviewing) {
    $('count').textContent = `${chosen.size} to add`;
    $('go').textContent = `Add ${chosen.size} app${chosen.size === 1 ? '' : 's'}`;
    $('go').disabled = chosen.size === 0;
    $('go').classList.remove('hidden');
  } else if (tab === 'apps') {
    $('count').textContent = `${picked.size} selected`;
    $('go').textContent = 'Review and add';
    $('go').disabled = picked.size === 0;
    $('go').classList.remove('hidden');
  } else {
    $('count').textContent = '';
    $('go').classList.add('hidden');
  }
  // "Save as pack…" needs ticked apps, so it shows only on the list with a selection.
  const canPack = !reviewing && tab === 'apps' && picked.size > 0;
  if (!canPack) $('packForm').classList.add('hidden');
  $('savePack').classList.toggle('hidden', !canPack || !$('packForm').classList.contains('hidden'));
}
$('go').onclick = () => {
  if (!$('viewReview').classList.contains('hidden')) return addChosen();
  review(() => window.api.popularPlan([...picked]), 'apps', `${picked.size} app${picked.size === 1 ? '' : 's'}`);
};
$('back').onclick = () => { plan = null; chosen.clear(); showView(planFrom === 'packs' ? 'viewPacks' : 'viewApps'); status(''); sync(); };
$('close').onclick = () => window.close();

// --- the description tooltip ------------------------------------------------------------
// One element, placed under the hovered (or keyboard-focused) row, or above it when there is
// no room below. A short delay keeps it from flickering as the pointer crosses the list.
const TIP_DELAY_MS = 250;
let tipRow = null;
let tipTimer = null;
function hideTip() {
  clearTimeout(tipTimer);
  tipTimer = null;
  tipRow = null;
  $('tip').classList.add('hidden');
}
function showTip(row) {
  const tip = $('tip');
  tip.querySelector('.what').textContent = row.dataset.what || row.querySelector('.nm').textContent;
  tip.querySelector('.from').textContent = row.dataset.from || '';
  tip.style.left = '0px'; tip.style.top = '0px';
  tip.classList.remove('hidden');
  const r = row.getBoundingClientRect();
  const t = tip.getBoundingClientRect();
  const margin = 8;
  const below = r.bottom + 4;
  const top = below + t.height <= window.innerHeight - margin ? below : Math.max(margin, r.top - t.height - 4);
  const left = Math.max(margin, Math.min(r.left + 22, window.innerWidth - t.width - margin));
  tip.style.left = `${Math.round(left)}px`;
  tip.style.top = `${Math.round(top)}px`;
}
function tipFor(row) {
  if (row === tipRow) return;
  hideTip();
  if (!row) return;
  tipRow = row;
  tipTimer = setTimeout(() => { if (tipRow === row && row.isConnected) showTip(row); }, TIP_DELAY_MS);
}
const rowOf = (target) => (target && target.closest ? target.closest('#viewApps .item') : null);
$('viewApps').addEventListener('mouseover', (e) => tipFor(rowOf(e.target)));
$('viewApps').addEventListener('mouseleave', hideTip);
$('viewApps').addEventListener('focusin', (e) => tipFor(rowOf(e.target)));
$('viewApps').addEventListener('focusout', hideTip);
// Anything that moves or redraws the rows takes the tooltip away rather than leave it stranded.
document.querySelector('.body').addEventListener('scroll', hideTip, { passive: true });
window.addEventListener('blur', hideTip);
window.addEventListener('resize', hideTip);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTip(); });

// --- favorites: the user's own apps and packs, from a file they edit -------------------
let favFile = 'favorites.yaml';
// Anything the file listed that could not be used, said once, with the reasons a click away.
async function loadFavNote() {
  try {
    const f = await window.api.favoritesStatus();
    favFile = f.file || favFile;
    const note = $('favNote');
    note.classList.toggle('hidden', !f.problems.length);
    note.querySelector('summary').textContent = `${favFile}: ${f.problems.length} thing${f.problems.length === 1 ? '' : 's'} could not be used`;
    const ul = note.querySelector('ul'); ul.innerHTML = '';
    for (const p of f.problems) ul.appendChild(el('li', null, p));
  } catch {} // an older main process without favorites: nothing to say
}
$('favEdit').onclick = async () => {
  try {
    const r = await window.api.favoritesOpen();
    status(`${r.created ? 'Created' : 'Opened'} ${r.path}${r.revealed ? ' — no program is set up to open it, so it is shown in its folder' : ''}. Save your changes, then come back to this window.`, 'ok');
  } catch (e) { status(clean(e), 'bad'); }
};
// Coming back from the editor: read the file again, so a saved change is simply there.
let refreshing = false;
window.addEventListener('focus', async () => {
  if (refreshing || !$('viewReview').classList.contains('hidden')) return;
  refreshing = true;
  try {
    await loadFavNote();
    if (tab === 'packs') await loadPacks();
    else {
      apps = await window.api.popularList();
      for (const id of [...picked]) if (!apps.some((a) => a.id === id && !a.tracked)) picked.delete(id);
      renderApps();
    }
    sync();
  } catch {} finally { refreshing = false; }
});

// --- save the ticked apps as a pack -------------------------------------------------------
$('savePack').onclick = () => { $('packForm').classList.remove('hidden'); sync(); $('packName').focus(); };
$('packCancel').onclick = () => { $('packForm').classList.add('hidden'); $('packName').value = ''; sync(); };
$('packName').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('packSave').click(); else if (e.key === 'Escape') $('packCancel').click(); });
$('packSave').onclick = async () => {
  const name = $('packName').value.trim();
  if (!name) { status('Give the pack a name first.', 'bad'); $('packName').focus(); return; }
  try {
    const p = await window.api.packsSave(name, 'Picked in Popular apps.', [...picked]);
    status(`Saved "${p.name}" with ${p.count} app${p.count === 1 ? '' : 's'}. It is under Packs, where you can add it again or export it.`, 'ok');
    $('packCancel').click();
  } catch (e) { status(clean(e), 'bad'); }
};
$('filter').oninput = renderApps;
async function setTab(next) {
  tab = next;
  $('tabs').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  showView(tab === 'packs' ? 'viewPacks' : 'viewApps');
  status('');
  try {
    if (tab === 'packs') await loadPacks();
    else { apps = await window.api.popularList(); renderApps(); status(`${apps.length} apps. Tick the ones you want — each is added from your preferred source, and you review where every file comes from first.`); }
  } catch (e) { status(clean(e), 'bad'); }
  sync();
}
$('tabs').querySelectorAll('button').forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
// Opened from Scan this PC with the apps that were ticked there (?scan=id,id): go straight to
// their review. Back returns to the ordinary list.
const scanIds = (new URLSearchParams(location.search).get('scan') || '').split(',').filter((id) => /^[a-z0-9]{1,80}$/.test(id));
loadFavNote()
  .then(() => setTab(new URLSearchParams(location.search).get('tab') === 'packs' ? 'packs' : 'apps'))
  .then(() => { if (scanIds.length) return review(() => window.api.scanPlan(scanIds), 'apps', `${scanIds.length} app${scanIds.length === 1 ? '' : 's'} found on this PC`); });
</script>
</body>
</html>
